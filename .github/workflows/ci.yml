name: Central CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-validation:
    name: Validate source
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html_path = Path("product-analyzer/frontend/index.html")
          if not html_path.exists():
              raise SystemExit("product-analyzer/frontend/index.html not found")
          html = html_path.read_text(encoding="utf-8")
          matches = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html)
          inline_code = "\n".join([m for m in matches if m.strip()])
          if not inline_code:
              print("No inline JS code found to validate, skipping node check.")
          else:
              Path("/tmp/central-frontend.js").write_text(inline_code, encoding="utf-8")
              import subprocess
              subprocess.run(["node", "--check", "/tmp/central-frontend.js"], check=True)
              store_html = Path("product-analyzer/frontend/tienda.html").read_text(encoding="utf-8")
              store_scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", store_html)
              store_code = "\n".join([script for script in store_scripts if script.strip()])
              Path("/tmp/central-store.js").write_text(store_code, encoding="utf-8")
              subprocess.run(["node", "--check", "/tmp/central-store.js"], check=True)
              login_html = Path("product-analyzer/frontend/admin-login.html").read_text(encoding="utf-8")
              login_scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", login_html)
              login_code = "\n".join([script for script in login_scripts if script.strip()])
              if 'window.location.replace("/admin")' not in login_code:
                  raise SystemExit("Admin login must redirect to /admin after authentication.")
              Path("/tmp/central-admin-login.js").write_text(login_code, encoding="utf-8")
              subprocess.run(["node", "--check", "/tmp/central-admin-login.js"], check=True)
          PY

      - name: Build Figma showcase
        shell: bash
        run: |
          npm --prefix product-analyzer/headphones ci --no-audit --no-fund
          npm --prefix product-analyzer/headphones run build
          test -f product-analyzer/frontend/headphones/index.html
      - name: Upload Headphones static build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: headphones-static-build
          path: product-analyzer/frontend/headphones
          if-no-files-found: error
          retention-days: 7

      - name: Synchronize and verify Headphones static build
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          build_status="$(git status --porcelain -- product-analyzer/frontend/headphones)"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${PR_HEAD_REPO}" == "${GITHUB_REPOSITORY}" ]]; then
            if [[ -n "${build_status}" ]]; then
              mkdir -p /tmp/headphones-static-build
            cp -a product-analyzer/frontend/headphones/. /tmp/headphones-static-build/
            git fetch origin "${PR_HEAD_REF}"
            git checkout -B "${PR_HEAD_REF}" FETCH_HEAD
            rm -rf product-analyzer/frontend/headphones
            mkdir -p product-analyzer/frontend/headphones
            cp -a /tmp/headphones-static-build/. product-analyzer/frontend/headphones/
            if [[ -z "$(git status --porcelain -- product-analyzer/frontend/headphones)" ]]; then
              echo "Generated Headphones build was not preserved after switching to the PR branch."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add product-analyzer/frontend/headphones
            git commit -m "build: sync Headphones static assets"
            git push origin "HEAD:${PR_HEAD_REF}"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref="${PR_HEAD_REF}"
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/dispatches" -f ref="${PR_HEAD_REF}"
          elif [[ -n "${build_status}" ]]; then
            git status --short -- product-analyzer/frontend/headphones
            echo "Headphones static build differs from committed assets; update the build before merging."
            exit 1
          fi
          if [[ -n "$(git status --porcelain -- product-analyzer/frontend/headphones)" ]]; then
            git status --short -- product-analyzer/frontend/headphones
            echo "Headphones static build is not synchronized."
            exit 1
          fi

      - name: Validate admin routes and API proxy
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg_path = Path("product-analyzer/frontend/vercel.json")
          assert cfg_path.exists(), "vercel.json configuration file missing"
          cfg = json.loads(cfg_path.read_text(encoding="utf-8"))
          frontend = Path("product-analyzer/frontend")
          assert (frontend / "index.html").is_file(), "Admin panel missing"
          assert (frontend / "central.css").is_file(), "Shared admin stylesheet missing"
          assert (frontend / "admin-login.html").is_file(), "Admin login missing"
          rewrites = cfg.get("rewrites", [])
          api_v1 = next((r for r in rewrites if r.get("source") == "/api/v1/:path*"), None)
          assert api_v1 and api_v1["destination"].endswith("/api/v1/:path*"), "Versioned API proxy must not duplicate /v1"
          assert any(r.get("source") == "/" and r.get("destination") == "/index.html" for r in rewrites), "Root must serve admin panel"
          assert any(r.get("source") == "/tienda" and r.get("destination") == "/tienda.html" for r in cfg.get("redirects", [])), "Store must remain on Central"
          html = (frontend / "admin-login.html").read_text(encoding="utf-8")
          assert 'fetch("/api/v1/auth/login"' in html, "Login must use same-origin versioned API"
          print("Admin routes, login, CSS and API proxy validated")
          PY

      - name: Validate admin login JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html_path = Path("product-analyzer/frontend/admin-login.html")
          if not html_path.exists():
              raise SystemExit("product-analyzer/frontend/admin-login.html not found")
          html = html_path.read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html)
          inline_code = "\n".join([s for s in scripts if s.strip()])
          if not inline_code:
              print("No inline JS scripts found in login, skipping node check.")
          else:
              Path("/tmp/central-login.js").write_text(inline_code, encoding="utf-8")
              import subprocess
              subprocess.run(["node", "--check", "/tmp/central-login.js"], check=True)
          PY

      - name: Validate backend Python
        shell: bash
        run: |
          python -m compileall -q product-analyzer/app

      - name: Test product discovery and enrichment
        shell: bash
        run: |
          python -m pip install requests psycopg2-binary schedule fastapi==0.115.0 cryptography==46.0.3 httpx
          PYTHONPATH=product-analyzer/app python -m unittest discover -s product-analyzer/tests -p 'test_product_sources.py'
          PYTHONPATH=product-analyzer/app python -m unittest discover -s product-analyzer/tests -p 'test_aliexpress_oauth.py'
          PYTHONPATH=product-analyzer/app python -m unittest discover -s product-analyzer/tests -p 'test_pricing.py'
          PYTHONPATH=product-analyzer/app python -m unittest discover -s product-analyzer/tests -p 'test_store_commerce.py'
          PYTHONPATH=product-analyzer/app python -m unittest discover -s product-analyzer/tests -p 'test_storefront_sections.py'
          PYTHONPATH=product-analyzer/app python -m unittest discover -s product-analyzer/tests -p 'test_telegram_alert.py'
          PYTHONPATH=product-analyzer/app python -m unittest discover -s product-analyzer/tests -p 'test_marketplace_search.py'
          PYTHONPATH=product-analyzer/app python -m unittest discover -s product-analyzer/tests -p 'test_main.py'
          PYTHONPATH=product-analyzer/app python -m unittest discover -s product-analyzer/tests -p 'test_main_url_only.py'
          PYTHONPATH=product-analyzer/app python -m unittest discover -s product-analyzer/tests -p 'test_marketplace_safety.py'
          PYTHONPATH=product-analyzer/app python -m unittest discover -s product-analyzer/tests -p 'test_analysis.py'
          python -m unittest discover -s product-analyzer/tests -p 'test_catalog_cli.py'
          python -m py_compile scripts/importar-lote-central.py scripts/importar-url-central.py

  docker:
    name: Validate backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build backend
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./product-analyzer/app
          file: ./product-analyzer/app/Dockerfile
          push: false
          tags: central-api:ci
