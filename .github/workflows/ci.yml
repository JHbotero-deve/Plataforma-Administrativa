name: Central CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-validation:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("product-analyzer/frontend/index.html").read_text(encoding="utf-8")
          matches = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html)
          if not matches:
              raise SystemExit("Frontend script not found")
          Path("/tmp/central-frontend.js").write_text("\n".join(matches), encoding="utf-8")
          PY
          node --check /tmp/central-frontend.js
      - name: Build Figma showcase
        shell: bash
        run: |
          npm --prefix product-analyzer/headphones install --no-audit --no-fund
          npm --prefix product-analyzer/headphones run build
          test -f product-analyzer/frontend/headphones/index.html

      - name: Validate backend Python
        shell: bash
        run: |
          python -m compileall -q product-analyzer/app

      - name: Reject development debris
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("product-analyzer")
          patterns = (
              re.compile(r"\bTODO\b"),
              re.compile(r"\bFIXME\b"),
              re.compile(r"neon\.tech"),
              re.compile(r"ep-solitary-truth"),
          )
          ignored = {".env", ".env.local", ".env.production"}
          findings = []

          for path in root.rglob("*"):
              if not path.is_file() or path.name in ignored:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      findings.append(f"{path}:{line_no}:{line}")

          if findings:
              print("\n".join(findings))
              raise SystemExit("Development debris detected")
          PY

  docker:
    name: Validate backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: ./product-analyzer/app
          file: ./product-analyzer/app/Dockerfile
          push: false
          tags: central-api:ci
