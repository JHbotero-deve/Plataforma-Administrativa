name: Central CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-validation:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html_path = Path("product-analyzer/frontend/index.html")
          if not html_path.exists():
              raise SystemExit("product-analyzer/frontend/index.html not found")
          html = html_path.read_text(encoding="utf-8")
          matches = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html)
          inline_code = "\n".join([m for m in matches if m.strip()])
          if not inline_code:
              print("No inline JS code found to validate, skipping node check.")
          else:
              Path("/tmp/central-frontend.js").write_text(inline_code, encoding="utf-8")
              import subprocess
              subprocess.run(["node", "--check", "/tmp/central-frontend.js"], check=True)
          PY

      - name: Build Figma showcase
        shell: bash
        run: |
          npm --prefix product-analyzer/headphones install --no-audit --no-fund
          npm --prefix product-analyzer/headphones run build
          test -f product-analyzer/frontend/headphones/index.html

      - name: Validate admin routes and API proxy
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg_path = Path("vercel.json")
          assert cfg_path.exists(), "vercel.json configuration file missing"
          cfg = json.loads(cfg_path.read_text(encoding="utf-8"))
          frontend = Path("product-analyzer/frontend")
          assert (frontend / "index.html").is_file(), "Admin panel missing"
          assert (frontend / "central.css").is_file(), "Shared admin stylesheet missing"
          assert (frontend / "admin-login.html").is_file(), "Admin login missing"
          rewrites = cfg.get("rewrites", [])
          api_v1 = next((r for r in rewrites if r.get("source") == "/api/v1/:path*"), None)
          assert api_v1 and api_v1["destination"].endswith("/api/v1/:path*"), "Versioned API proxy must not duplicate /v1"
          assert any(r.get("source") == "/" and r.get("destination") == "/index.html" for r in rewrites), "Root must serve admin panel"
          assert any(r.get("source") == "/tienda" and "central-7ykr.vercel.app/tienda" in r.get("destination", "") for r in cfg.get("redirects", [])), "Store must remain on Central"
          html = (frontend / "admin-login.html").read_text(encoding="utf-8")
          assert 'fetch("/api/v1/auth/login"' in html, "Login must use same-origin versioned API"
          print("Admin routes, login, CSS and API proxy validated")
          PY

      - name: Validate admin login JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html_path = Path("product-analyzer/frontend/admin-login.html")
          if not html_path.exists():
              raise SystemExit("product-analyzer/frontend/admin-login.html not found")
          html = html_path.read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html)
          inline_code = "\n".join([s for s in scripts if s.strip()])
          if not inline_code:
              print("No inline JS scripts found in login, skipping node check.")
          else:
              Path("/tmp/central-login.js").write_text(inline_code, encoding="utf-8")
              import subprocess
              subprocess.run(["node", "--check", "/tmp/central-login.js"], check=True)
          PY

      - name: Validate backend Python
        shell: bash
        run: |
          python -m compileall -q product-analyzer/app

  docker:
    name: Validate backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build backend
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./product-analyzer/app
          file: ./product-analyzer/app/Dockerfile
          push: false
          tags: central-api:ci
