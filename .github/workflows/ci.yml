name: Central CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-validation:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("product-analyzer/frontend/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>([\s\S]*?)</script>", html)
          if not match:
              raise SystemExit("Frontend script not found")
          Path("/tmp/central-frontend.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/central-frontend.js
      - name: Reject development debris
        run: '! grep -RniE "TODO|FIXME|neon\\.tech|ep-solitary-truth" product-analyzer --exclude-dir=.git'

  docker:
    name: Validate backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: ./product-analyzer/app
          file: ./product-analyzer/app/Dockerfile
          push: false
          tags: central-api:ci
