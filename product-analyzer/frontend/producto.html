<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>Producto | Central</title>
<meta name="description" content="Explora los detalles del producto en Central.">
<link rel="canonical" id="canonical">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Central">
<meta property="og:title" id="ogTitle" content="Producto | Central">
<meta property="og:description" id="ogDesc" content="Producto publicado en Central.">
<meta property="og:image" id="ogImage" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#030907;--panel:#0b1511;--panel2:#101d17;--line:#20392d;--text:#f4fff9;--muted:#9aafa4;--green:#00e89b;--green2:#00b978;--purple:#7867ff;--orange:#ff8a00}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 24% 15%,rgba(0,232,155,.12),transparent 38%),radial-gradient(ellipse at 85% 75%,rgba(89,70,210,.1),transparent 36%),var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.shell{width:min(1320px,calc(100% - 40px));margin:auto}
.announcement{padding:7px 12px;text-align:center;background:#063c2b;color:#baffdf;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.header{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,232,155,.16)}
.brand{font:800 18px "Space Grotesk";letter-spacing:.16em}
.brand span{color:var(--green)}
.header-actions{display:flex;align-items:center;gap:10px}
.header-link,.icon-btn{border:1px solid var(--line);border-radius:999px;background:#0b1711;color:#d8e9df;padding:9px 14px;font-size:11px}
.icon-btn{width:38px;height:38px;padding:0;font-size:17px}
.breadcrumb{padding:18px 0;color:var(--muted);font-size:11px}
.breadcrumb a{color:#9deac8}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start;padding:8px 0 56px}
.viewer{min-width:0}
.visual{position:relative;min-height:560px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(0,232,155,.22);border-radius:24px;background:radial-gradient(circle at 50% 54%,rgba(0,232,155,.2),rgba(13,28,21,.8) 43%,#050a07 78%);box-shadow:0 28px 80px #0008}
.visual:before,.visual:after{content:"";position:absolute;width:70%;aspect-ratio:1;border:1px solid rgba(0,232,155,.2);border-radius:50%;pointer-events:none}
.visual:after{width:48%;border-color:rgba(255,255,255,.08)}
.visual img{position:relative;z-index:2;width:100%;height:540px;object-fit:contain;padding:35px;filter:drop-shadow(0 30px 35px #000);cursor:zoom-in}
.visual model-viewer{position:relative;z-index:3;width:100%;height:540px;background:transparent}
.visual-empty{position:relative;z-index:2;color:var(--muted);font-size:12px}
.visual-controls{position:absolute;z-index:5;left:16px;right:16px;bottom:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.control-group{display:flex;gap:7px}
.control{border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(4,13,9,.82);color:#e6fff2;padding:8px 12px;font-size:10px;backdrop-filter:blur(12px)}
.control:disabled{opacity:.45;cursor:not-allowed}
.thumbs{display:flex;gap:10px;overflow:auto;padding:12px 2px}
.thumb{flex:0 0 76px;width:76px;height:76px;border:1px solid var(--line);border-radius:12px;background:#0a130e;overflow:hidden;padding:4px}
.thumb.active{border-color:var(--green);box-shadow:0 0 16px rgba(0,232,155,.18)}
.thumb img{width:100%;height:100%;object-fit:contain}
.side{display:grid;gap:14px}
.product-panel,.cart-panel{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(17,32,24,.97),rgba(7,15,10,.98));padding:22px;box-shadow:0 20px 60px #0005}
.kicker{color:var(--green);font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
h1{font:700 clamp(27px,3.5vw,42px)/1.04 "Space Grotesk";letter-spacing:-.04em;margin:10px 0}
.description{color:var(--muted);font-size:13px;white-space:pre-line}
.price{font:700 30px "Space Grotesk";color:#baffdf;margin:18px 0 5px}
.old-price{color:#7f9187;text-decoration:line-through;font-size:12px}
.quality{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(0,232,155,.22);border-radius:999px;padding:5px 9px;color:#a9f8d5;font-size:10px;margin:12px 0}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.spec{padding:11px;border:1px solid rgba(255,255,255,.08);border-radius:11px;background:rgba(3,10,7,.45);min-width:0}
.spec span{display:block;color:#8ca398;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.spec b{display:block;margin-top:4px;font-size:12px;overflow-wrap:anywhere}
.actions{display:grid;gap:9px;margin-top:18px}
.primary,.secondary{min-height:46px;border-radius:999px;padding:12px 16px;font-size:11px;font-weight:800;text-align:center}
.primary{border:1px solid var(--green);background:linear-gradient(100deg,var(--green),#62ffd0);color:#032117;box-shadow:0 0 22px rgba(0,232,155,.22)}
.secondary{border:1px solid #40564a;background:transparent;color:#e4f4eb}
.note{margin:12px 0 0;color:#83968b;font-size:10px}
.cart-panel h2{font:600 18px "Space Grotesk";margin:0 0 12px}
.cart-empty{color:var(--muted);font-size:12px;padding:12px 0}
.cart-line{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.cart-line img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#101b15}
.cart-line b{display:block;font-size:11px;line-height:1.3}
.cart-line small{color:var(--muted);font-size:10px}
.cart-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:10px;font-weight:800}
.cart-link{display:block;text-align:center;margin-top:12px;color:#9ef5ce;font-size:11px;font-weight:700}
.zoom{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.92)}
.zoom.open{display:grid}
.zoom img{max-width:min(94vw,1200px);max-height:88vh;object-fit:contain}
.zoom button{position:absolute;top:18px;right:18px;width:42px;height:42px;border:1px solid #43574b;border-radius:50%;background:#102017;color:#fff;font-size:22px}
.footer{padding:18px 0 32px;border-top:1px solid rgba(0,232,155,.15);color:#71877a;font-size:10px}
.error{padding:50px 20px;text-align:center;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.visual{min-height:460px}.visual img,.visual model-viewer{height:440px}}
@media(max-width:620px){.shell{width:calc(100% - 22px)}.header{height:62px}.header-link{padding:8px 10px}.breadcrumb{padding:13px 0}.layout{gap:12px;padding-top:2px}.visual{min-height:340px;border-radius:17px}.visual img,.visual model-viewer{height:330px;padding:20px}.visual-controls{left:9px;right:9px;bottom:9px}.control{padding:7px 9px;font-size:9px}.side{grid-template-columns:1fr}.product-panel,.cart-panel{padding:17px;border-radius:16px}h1{font-size:31px}.price{font-size:27px}.footer{padding-bottom:24px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="announcement">EXPLORA LA COLECCIÓN CENTRAL <span>·</span> PRODUCTOS Y OFERTAS DESTACADAS</div>
<div class="shell">
<header class="header"><a class="brand" href="/tienda">CENTRAL<span>.</span></a><div class="header-actions"><a class="header-link" href="/tienda">← Volver a la tienda</a><a class="icon-btn" href="/tienda#cart" aria-label="Ver carrito">▣</a></div></header>
<div class="breadcrumb"><a href="/tienda">Tienda</a> / <span id="crumb">Producto</span></div>
<main id="app"><div class="error">Cargando ficha del producto…</div></main>
<footer class="footer">Los productos externos se compran directamente en sus comercios. Central no procesa sus pagos ni gestiona sus envíos.</footer>
</div>
<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Imagen ampliada"><button id="zoomClose" type="button" aria-label="Cerrar">×</button><img id="zoomImage" alt=""></div>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(v,c="COP")=>{const n=Number(v);if(!Number.isFinite(n)||n<=0)return"Precio por confirmar";try{return new Intl.NumberFormat("es-CO",{style:"currency",currency:String(c).toUpperCase()==="USD"?"USD":"COP",maximumFractionDigits:0}).format(n)}catch{return String(v)}};
const imageUrl=value=>{try{const u=new URL(String(value||""),location.origin);return !u.username&&!u.password&&(u.protocol==="https:"||u.origin===location.origin)?u.href:""}catch{return""}};
const idMatch=location.pathname.match(/-(\d+)\/?$/),id=idMatch?.[1]||new URLSearchParams(location.search).get("id");
const own=p=>String(p.platform||"").toLowerCase()==="personal"||String(p.checkout_mode||"").toUpperCase()==="CENTRAL";
let product=null,images=[],imageIndex=0;
function setImage(index){if(!images.length)return;imageIndex=(index+images.length)%images.length;$("mainImage").src=images[imageIndex];document.querySelectorAll(".thumb").forEach((el,i)=>el.classList.toggle("active",i===imageIndex));$("imageCount").textContent=(imageIndex+1)+" / "+images.length}
function renderCart(){let cart=[];try{cart=JSON.parse(localStorage.getItem("central_cart")||"[]")}catch{}const qty=cart.reduce((n,x)=>n+Number(x.quantity||0),0),total=cart.reduce((n,x)=>n+Number(x.price||0)*Number(x.quantity||0),0);$("cartCount").textContent=qty;$("cartLines").innerHTML=cart.length?cart.slice(0,3).map(x=>'<div class="cart-line">'+(imageUrl(x.image_url)?'<img src="'+esc(imageUrl(x.image_url))+'" alt="">':'<span></span>')+'<div><b>'+esc(x.title)+'</b><small>'+Number(x.quantity||0)+' × '+esc(money(x.price,"COP"))+'</small></div><strong>'+esc(money(Number(x.price||0)*Number(x.quantity||0),"COP"))+'</strong></div>').join(""):'<div class="cart-empty">Tu carrito está vacío. Los productos de marketplaces se compran directamente en su tienda.</div>';$("cartTotal").textContent=money(total,"COP")}
function addToCart(p){let cart=[];try{cart=JSON.parse(localStorage.getItem("central_cart")||"[]")}catch{}const productId=p.product_id||p.id,existing=cart.find(x=>String(x.product_id)===String(productId));if(existing)existing.quantity=Number(existing.quantity||0)+1;else cart.push({product_id:productId,publication_id:p.id,title:p.title,image_url:images[0]||"",price:Number(p.sale_price??p.current_price??0),quantity:1});localStorage.setItem("central_cart",JSON.stringify(cart))}
function showError(message){$("app").innerHTML='<div class="error">'+esc(message)+'<p><a class="secondary" href="/tienda">Volver a la tienda</a></p></div>'}
async function load(){
 if(!id){showError("No se encontró el identificador del producto.");return}
 const response=await fetch("/api/publications/product/"+encodeURIComponent(id),{cache:"no-store"});
 if(!response.ok)throw Error(response.status===404?"Este producto ya no está disponible.":"No fue posible consultar el producto.");
 product=await response.json();
 images=[...(Array.isArray(product.image_gallery)?product.image_gallery:[])].map(imageUrl).filter(Boolean);
 const main=imageUrl(product.image_url);if(main&&!images.includes(main))images.unshift(main);
 const model=imageUrl(product.model_url),isOwn=own(product),platform=String(product.platform||"Central"),price=product.price_display||money(product.sale_price??product.current_price,product.currency),external=product.product_url||product.affiliate_url||"";
 document.title=(product.title||"Producto")+" | Central";$("crumb").textContent=product.title||"Producto";
 $("canonical").href=product.canonical_url||location.href;$("ogTitle").content=product.title||"Producto";$("ogDesc").content=product.description||product.subtitle||"Producto publicado en Central.";$("ogImage").content=main||"";
 const visual=main?'<img id="mainImage" src="'+esc(main)+'" alt="'+esc(product.title||"Producto")+'">'+(model?'<model-viewer id="modelViewer" hidden src="'+esc(model)+'" alt="'+esc(product.title||"Modelo 3D")+'" camera-controls auto-rotate rotation-per-second="18deg" shadow-intensity="1" exposure="1" ar ar-modes="webxr scene-viewer quick-look"></model-viewer>':""):model?'<model-viewer id="modelViewer" src="'+esc(model)+'" alt="'+esc(product.title||"Modelo 3D")+'" camera-controls auto-rotate rotation-per-second="18deg" shadow-intensity="1" exposure="1" ar ar-modes="webxr scene-viewer quick-look"></model-viewer>':'<div class="visual-empty">Imagen del producto no disponible</div>';
 const thumbnails=images.length>1?'<div class="thumbs">'+images.slice(0,10).map((src,i)=>'<button class="thumb '+(src===main?"active":"")+'" type="button" data-image="'+i+'" aria-label="Ver imagen '+(i+1)+'"><img src="'+esc(src)+'" alt=""></button>').join("")+'</div>':"";
 const quality=product.quality_status==="verified"||product.is_verified?"Ficha verificada":"Información del comercio";
 $("app").innerHTML='<div class="layout"><section class="viewer"><div class="visual">'+visual+'<div class="visual-controls"><div class="control-group"><button class="control" id="prevImage" type="button" '+(images.length<2?"disabled":"")+'>‹ Anterior</button><button class="control" id="nextImage" type="button" '+(images.length<2?"disabled":"")+'>Siguiente ›</button></div><span class="control" id="imageCount">'+(images.length?("1 / "+images.length):"Vista del producto")+'</span></div></div>'+(model&&main?'<div class="control-group" style="padding:0 4px 8px"><button class="control" id="toggle3d" type="button">Ver modelo 3D</button></div>':"")+thumbnails+'</section><aside class="side"><section class="product-panel"><div class="kicker">'+esc(platform)+'</div><h1>'+esc(product.title||"Producto")+'</h1><p class="description">'+esc(product.description||product.subtitle||"Consulta la información disponible del producto.")+'</p><div class="price">'+esc(price)+'</div>'+(product.previous_price?'<div class="old-price">Antes: '+esc(money(product.previous_price,product.currency))+'</div>':"")+'<span class="quality">✓ '+esc(quality)+'</span><div class="specs"><div class="spec"><span>Vendedor</span><b>'+esc(product.seller_name||"No informado")+'</b></div><div class="spec"><span>Disponibilidad</span><b>'+(product.stock==null?"Por confirmar":Number(product.stock)>0?"Disponible":"Agotado")+'</b></div><div class="spec"><span>Categoría</span><b>'+esc(product.category||"Sin categoría")+'</b></div><div class="spec"><span>Referencia</span><b>'+esc(product.sku||product.external_id||product.product_id||"No informada")+'</b></div></div><div class="actions">'+(isOwn?'<button class="primary" id="buy">AÑADIR AL CARRITO</button>':'<button class="primary" id="buy">COMPRAR EN '+esc(platform.toUpperCase())+'</button>')+'<a class="secondary" href="/tienda">Seguir explorando</a></div><p class="note">'+(isOwn?"Compra gestionada por Central mediante Wompi.":"La compra, el pago, el envío y las condiciones dependen del comercio de origen.")+'</p></section><section class="cart-panel"><h2>Tu carrito <span id="cartCount" style="color:var(--green)">0</span></h2><div id="cartLines"></div><div class="cart-total"><span>Subtotal</span><span id="cartTotal">COP 0</span></div><a class="cart-link" href="/tienda#cart">VER CARRITO Y CONTINUAR →</a></section></aside></div>';
 if(images.length)setImage(0);
 $("prevImage").onclick=()=>setImage(imageIndex-1);$("nextImage").onclick=()=>setImage(imageIndex+1);const toggle3d=$("toggle3d");if(toggle3d)toggle3d.onclick=()=>{const image=$("mainImage"),viewer=$("modelViewer"),show=viewer.hidden;viewer.hidden=!show;image.hidden=show;toggle3d.textContent=show?"Ver imágenes":"Ver modelo 3D"};
 document.querySelectorAll("[data-image]").forEach(el=>el.onclick=()=>setImage(Number(el.dataset.image)));
 $("mainImage")?.addEventListener("click",()=>{$("zoomImage").src=images[imageIndex];$("zoom").classList.add("open")});
 $("zoomClose").onclick=()=>$("zoom").classList.remove("open");$("zoom").onclick=e=>{if(e.target===$("zoom"))$("zoom").classList.remove("open")};
 $("buy").onclick=async()=>{if(isOwn){addToCart(product);location.href="/tienda#cart";return}if(String(product.platform).toLowerCase()==="amazon"){try{const r=await fetch("/api/affiliate/click",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({product_id:product.product_id})});const d=await r.json();if(r.ok&&d.url){location.href=d.url;return}}catch{}}if(external)location.href=external;else alert("Este producto todavía no tiene un enlace de compra válido.")};
 renderCart();
 const schema={"@context":"https://schema.org","@type":"Product","name":product.title,"description":product.description||product.subtitle||undefined,"image":images.slice(0,10),"sku":product.sku||product.external_id||String(product.product_id),"offers":{"@type":"Offer","url":product.canonical_url||location.href,"price":Number(product.sale_price||product.current_price||0),"priceCurrency":product.currency||"COP"}};
 const script=document.createElement("script");script.type="application/ld+json";script.textContent=JSON.stringify(schema);document.head.appendChild(script);
}
load().catch(error=>showError(error.message||"No fue posible cargar el producto."));
})();
</script>
</body>
</html>
