<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Producto | Central</title><meta name="description" content="Producto publicado en Central."><link rel="canonical" id="canonical"><meta property="og:type" content="product"><meta property="og:site_name" content="Central"><meta property="og:title" id="ogTitle" content="Producto | Central"><meta property="og:description" id="ogDesc" content="Producto publicado en Central."><meta property="og:image" id="ogImage" content=""><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>:root{--bg:#07090d;--panel:#0e121a;--line:#202936;--text:#f5f7fa;--muted:#8c97a8;--lime:#b6f23a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui}.shell{width:min(1180px,calc(100% - 28px));margin:auto}.top{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font:800 18px "Space Grotesk"}.back{color:var(--muted);font-size:11px}.product{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:45px 0}.media{min-height:520px;background:#0b0f15;border:1px solid var(--line);border-radius:18px;display:grid;place-items:center;padding:30px}.media img{max-width:100%;max-height:500px;object-fit:contain}.copy{padding:20px 0}.kicker{color:var(--lime);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.copy h1{font:600 clamp(34px,5vw,64px)/1 "Space Grotesk";margin:12px 0}.desc{color:var(--muted);font-size:15px}.price{font:800 32px "Space Grotesk";color:var(--lime);margin:22px 0}.cta{border:0;background:var(--lime);color:#0b1008;border-radius:9px;padding:13px 18px;font-weight:800;cursor:pointer}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0}.meta div{border:1px solid var(--line);padding:11px;border-radius:9px;background:var(--panel);font-size:11px;color:var(--muted)}.gallery{display:flex;gap:8px;overflow:auto;margin-top:10px}.gallery img{width:70px;height:70px;object-fit:contain;background:#0b0f15;border:1px solid var(--line);border-radius:8px;cursor:pointer}@media(max-width:800px){.product{grid-template-columns:1fr}.media{min-height:350px}}</style></head><body><div class="shell"><header class="top"><a class="brand" href="/">CENTRAL</a><a class="back" href="/tienda">← Tienda</a></header><main id="app"><div class="product"><div class="media">Cargando producto…</div><div class="copy">Cargando…</div></div></main></div><script>(async()=>{const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=(v,c)=>new Intl.NumberFormat("es-CO",{style:"currency",currency:c==="USD"?"USD":"COP",maximumFractionDigits:0}).format(Number(v));const m=location.pathname.match(/-(\d+)\/?$/),id=m&&m[1];if(!id){document.getElementById("app").innerHTML="<p>Producto no encontrado.</p>";return}const r=await fetch("/api/publications/product/"+id,{cache:"no-store"});if(!r.ok){document.getElementById("app").innerHTML="<p>Producto no disponible.</p>";return}const p=await r.json(),url=p.canonical_url;document.title=(p.title||"Producto")+" | Central";document.getElementById("canonical").href=url;document.getElementById("ogTitle").content=p.title;document.getElementById("ogDesc").content=p.description||p.subtitle||"Producto publicado en Central.";document.getElementById("ogImage").content=p.image_url||"";let imgs=[...(p.image_gallery||[])];if(p.image_url&&!imgs.includes(p.image_url))imgs.unshift(p.image_url);document.getElementById("app").innerHTML='<div class="product"><section><div class="media"><img id="mainImg" src="'+esc(imgs[0]||"")+'" alt="'+esc(p.title)+'"></div><div class="gallery">'+imgs.slice(0,5).map(x=>'<img src="'+esc(x)+'" alt="'+esc(p.title)+'">').join("")+'</div></section><section class="copy"><div class="kicker">'+esc(p.platform||"Central")+'</div><h1>'+esc(p.title)+'</h1><p class="desc">'+esc(p.description||p.subtitle||"Producto publicado por Central.")+'</p><div class="price">'+esc(p.price_display||money(p.sale_price||p.current_price,p.currency))+'</div><div class="meta"><div>SKU / ID<br><b>'+esc(p.sku||p.external_id||p.product_id)+'</b></div><div>Disponibilidad<br><b>'+((p.stock==null||p.stock>0)?"Disponible":"Agotado")+'</b></div></div><button class="cta" id="buy">'+(String(p.platform).toLowerCase()==="amazon"?"Comprar en Amazon":p.checkout_mode==="CENTRAL"?"Comprar con Wompi":"Ver oferta")+'</button></section></div>';document.querySelectorAll(".gallery img").forEach(x=>x.onclick=()=>document.getElementById("mainImg").src=x.src);document.getElementById("buy").onclick=async()=>{if(String(p.platform).toLowerCase()==="amazon"){try{const x=await fetch("/api/affiliate/click",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({product_id:p.product_id})});const d=await x.json();if(x.ok&&d.url){location.href=d.url;return}}catch{}if(p.product_url)location.href=p.product_url;else alert("El producto no tiene una URL de Amazon válida")}else if(p.checkout_mode==="CENTRAL"){location.href="/tienda#cart"}else if(p.product_url)location.href=p.product_url};const schema={"@context":"https://schema.org","@type":"Product","name":p.title,"description":p.description||p.subtitle||p.title,"image":imgs.slice(0,10),"sku":p.sku||p.external_id||String(p.product_id),"offers":{"@type":"Offer","url":url,"price":Number(p.sale_price||p.current_price||0),"priceCurrency":p.currency,"availability":"https://schema.org/"+((p.stock==null||p.stock>0)?"InStock":"OutOfStock")}};const sc=document.createElement("script");sc.type="application/ld+json";sc.textContent=JSON.stringify(schema);document.head.appendChild(sc)})().catch(()=>document.getElementById("app").innerHTML="<p>No fue posible cargar el producto.</p>");</script></body></html>
