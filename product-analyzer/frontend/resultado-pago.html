<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Estado de tu compra · Central</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;display:grid;place-items:center;background:#101318;color:#f5f4ef;font:15px/1.55 system-ui,sans-serif}.card{width:min(560px,100%);padding:clamp(24px,6vw,48px);border:1px solid #2b3038;border-radius:20px;background:#171b21}.eyebrow{color:#ff8a00;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}h1{font-size:clamp(28px,6vw,42px);line-height:1.05;margin:12px 0}p{color:#a4a9b0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}a{display:inline-flex;padding:11px 15px;border-radius:8px;background:#ff8a00;color:#101318;text-decoration:none;font-weight:800}.secondary{background:#242a32;color:#f5f4ef}.notice{font-size:12px;color:#7e858e}
</style>
</head>
<body>
<main class="card" aria-live="polite">
 <div class="eyebrow">Central · confirmación de compra</div>
 <h1 id="title">Estamos confirmando tu pago</h1>
 <p id="message">Wompi está procesando la transacción. No cierres esta página mientras verificamos el estado.</p>
 <p id="reference" class="notice"></p>
 <div class="actions"><a id="invoice" href="#" hidden>Ver comprobante</a><a class="secondary" href="/tienda">Volver a la tienda</a></div>
</main>
<script>
(()=>{"use strict";
const reference=new URLSearchParams(location.search).get("reference");
const title=document.getElementById("title"),message=document.getElementById("message");
const invoice=document.getElementById("invoice");
document.getElementById("reference").textContent=reference?"Pedido: "+reference:"";
const wait=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));
async function check(){
 if(!reference){title.textContent="No encontramos la referencia";message.textContent="Vuelve a la tienda y revisa el estado de tu pedido.";return}
 for(let attempt=0;attempt<20;attempt++){
  try{
   const response=await fetch("/api/v1/wompi/payments/"+encodeURIComponent(reference),{cache:"no-store"});
   const data=await response.json().catch(()=>({}));
   if(response.ok&&data.status==="APPROVED"){
    title.textContent="¡Pago aprobado!";
    message.textContent="Tu compra fue confirmada. Enviamos el comprobante al correo registrado.";
    localStorage.removeItem("central_cart");
    if(data.invoice_number&&data.public_token){
     invoice.href="/factura.html?numero="+encodeURIComponent(data.invoice_number)+"&token="+encodeURIComponent(data.public_token);
     invoice.hidden=false;
    }
    return;
   }
   if(response.ok&&["DECLINED","VOIDED","ERROR"].includes(data.status)){
    title.textContent="El pago no fue aprobado";
    message.textContent="Tu carrito se conservó. Puedes volver a la tienda e intentarlo nuevamente.";
    return;
   }
  }catch{}
  await wait(3000);
 }
 title.textContent="El pago sigue en verificación";
 message.textContent="Conservamos tu carrito. Si Wompi ya confirmó el pago, el comprobante llegará por correo cuando se registre la aprobación.";
}
check();
})();
</script>
</body>
</html>
