services:
  db:
    image: postgres:16
    container_name: productos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: productos_user
      POSTGRES_PASSWORD: productos_pass
      POSTGRES_DB: productos_db
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./app/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productos_user -d productos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: productos_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  app:
    build: ./app
    container_name: productos_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./app:/app
    command: ["python", "main.py"]

  telegram:
    build: ./app
    container_name: productos_telegram
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./app:/app
    command: ["python", "-c", "from telegram_alert import run_bot; run_bot()"]

  api:
    build: ./app
    container_name: productos_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    image: nginx:alpine
    container_name: productos_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  db_data:
